upload_azure_templates_to_s3:
  stage: upload
  image: artifactory-product.checkpoint.com/docker-local/cloudguard-integrations/${CGNS_RUNNER_IMAGE}
  only:
    - master
    - staging
  script:
    - apt-get install -y jq
    - git clone -b "master" https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.locsec.net/cloudguard-integrations/ci-utils.git ${PROJECT_PATH}
    - source ci-utils/utils/aws_credentials/generate_aws_credentials.sh
    - bucket="azure.templates"
    - lambda="azure.templates-lambda"
    - if [[ ${CI_COMMIT_REF_NAME} == "master" ]]; then
    -     bucket="${bucket}.prod"
    -     lambda="${lambda}.prod"
    - fi
    - chmod +x .internal/azure_scripts/*
    - python3 .internal/azure_scripts/build_all.py -b qa
    - python3 .internal/azure_scripts/upload_templates.py --bucket ${bucket} --lambda-bucket ${lambda} --templates all
