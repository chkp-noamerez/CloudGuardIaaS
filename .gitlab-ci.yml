variables:
  USER_COMMIT_SHA: ''


include:
  - project: global-templates/devex
    file: '.template.yml'
    ref: main
  - project: cloudguard-integrations/ci-utils
    ref: master
    file: ci/.gitlab-ci-analysis.yml
  - project: cloudguard-integrations/ci-utils
    ref: master
    file: ci/.gitlab-ci-verify-jira.yml


workflow:
  rules:
    - when: always


stages:
  - analysis
  - test_native_templates
  - Verify
  - upload
  - prepare_release
  - github_upload


##### Analysis Jobs #####
shellcheck:
  stage: analysis
  script:
    - IGNORE_FILES=$(cat .shellcheckignore)
    - echo "---Ignoring files from shellcheckignore---"
    - echo "$IGNORE_FILES"
    - find . -name "*.sh" | grep -v "$IGNORE_FILES" | xargs shellcheck -e SC1071


pycodestyle:
  allow_failure: true


#### Tests for native cloud templates ####

#### Azure ARM Templates ####
test_azure_arm:
  stage: test_native_templates
  variables:
    solutions: gateway-load-balancer ha management mds single vmss vwan
  image: mcr.microsoft.com/azure-powershell:latest
  parallel:
    matrix: 
      - SOLUTION: [gateway-load-balancer, ha, management, mds, single, vmss, vwan]
  script:
    - apt update
    - apt install git -y
    - git clone https://github.com/Azure/arm-ttk.git
    - |
      echo "Testing marketplace-$SOLUTION"
      pwsh -c '
        Import-Module ./arm-ttk/arm-ttk/arm-ttk.psd1;
        Test-AzTemplate -TemplatePath  ./azure/templates/'marketplace-$SOLUTION'/ -Skip "apiVersions Should Be Recent" | Tee-Object -Variable TestResults;
        $TestFailures =  $TestResults | Where-Object { -not $_.Passed } ;
        If ($TestFailures -ne $null) {
          echo $TestFailures;
          exit 1;
        }
      '

test_azure_china_arm:
  stage: test_native_templates
  variables:
    solutions: gateway-load-balancer ha management mds single vmss vwan
  image: mcr.microsoft.com/azure-powershell:latest
  parallel:
    matrix: 
      - SOLUTION: [gateway-load-balancer, ha, management, mds, single, vmss, vwan]
  script:
    - apt update
    - apt install git -y
    - git clone https://github.com/Azure/arm-ttk.git
    - |
      echo "Testing marketplace-$SOLUTION"
      pwsh -c '
        Import-Module ./arm-ttk/arm-ttk/arm-ttk.psd1;
        Test-AzTemplate -TemplatePath  ./china/azure/'marketplace-$SOLUTION'/ -Skip "apiVersions Should Be Recent" | Tee-Object -Variable TestResults;
        $TestFailures =  $TestResults | Where-Object { -not $_.Passed } ;
        If ($TestFailures -ne $null) {
          echo $TestFailures;
          exit 1;
        }
      '
  allow_failure: true


#### Jobs to reflect changes from GitLab to GitHub release branch ####
prepare_github_release_branch:
  stage: prepare_release
  image: artifactory-product.checkpoint.com/docker/alpine:latest
  variables:
    ARTIFACTORY: "https://artifactory-product.checkpoint.com/artifactory"
  before_script:
    # Install GitHub CLI
    - echo "$ARTIFACTORY/alpine/edge/main" > /etc/apk/repositories
    - echo "$ARTIFACTORY/alpine/edge/community" >> /etc/apk/repositories
    - wget -O /etc/apk/keys/devis.rsa.pub $ARTIFACTORY/api/security/keypair/public/repositories/alpine
    - apk update && apk add openssl ca-certificates github-cli

  script:
    - git config --global user.email $GITLAB_USER_EMAIL
    - git config --global user.name $GITLAB_USER_NAME
    - git remote set-url origin "https://${GITLAB_USER_NAME}:${PIPELINE_RELEASE_TOKEN}@gitlab.locsec.net/cloudguard-integrations/CloudGuardIaaS.git"

    # Fetch all branches or the repo (running on master, and needed release branch to manage)
    - git fetch
    - git checkout -f master
    - git pull
    - git reset --hard origin/master
  
    # Keep the title message for the GitHub PR title
    - commit_message=$(git log --pretty=%s -n 1)

    # Now checkout to the release branch, this branch is the one who should reflect to GitHub
    - git checkout release
    - git pull

    # Squash all the content of master into release branch, on a conflict take master only.
    # git merge --allow-unrelated-histories --squash -X theirs master
    - if [ -n "$USER_COMMIT_SHA" ]; then
    -   git cherry-pick -n $USER_COMMIT_SHA -X theirs
    -   commit_message=$(git log --pretty=%s -n 1 ${USER_COMMIT_SHA:-$CI_COMMIT_SHA})
    - else
    -   git cherry-pick -n $CI_COMMIT_SHA -X theirs
    - fi

    # Remove the following files/directories from been reflected to GitHub
    # Add here any file/dir that should not reflected to GitHub, such as internal configuration ci/cd
    - git reset .gitlab-ci.yml .env.example DEVELOPMENT.md .vscode .openapi-generator-ignore scripts RELEASE.md .shellcheckignore .github/workflows .spectral common/Internal_cme_api_postman/*
    - git commit -m "$commit_message"

    # Push cherry-pick
    - git push origin release

  only:
    - master


reflect_github_release_branch:
  stage: github_upload
  image: artifactory-product.checkpoint.com/docker/alpine:latest
  variables:
    ARTIFACTORY: "https://artifactory-product.checkpoint.com/artifactory"

  before_script:
    # Install GitHub CLI
    - echo "$ARTIFACTORY/alpine/edge/main" > /etc/apk/repositories
    - echo "$ARTIFACTORY/alpine/edge/community" >> /etc/apk/repositories
    - wget -O /etc/apk/keys/devis.rsa.pub $ARTIFACTORY/api/security/keypair/public/repositories/alpine
    - apk update && apk add openssl ca-certificates github-cli

  script:
    # Push changes to GitHub...
    # !!! The job uses GitHub access token which must be renewed once a year. It's stored in ENV variables $GH_TOKEN
    - git config --global user.email $GITLAB_USER_EMAIL
    - git config --global user.name chkp-$GITLAB_USER_NAME

      # pull local master branch
    - git remote set-url origin https://${GITLAB_USER_NAME}:${PIPELINE_RELEASE_TOKEN}@gitlab.locsec.net/cloudguard-integrations/CloudGuardIaaS.git
    - git fetch

    # First, switch and pull the GitLab's dedicated master branch
    - git checkout -f release
    - git pull
    - git reset --hard origin/release

    # Keep the title message for the GitHub PR title
    - commit_message=$(git log --pretty=%s -n 1)

    # Create new branch that will be pushed to GitHub
    - git checkout -b $CI_PROJECT_PATH_SLUG-$CI_COMMIT_SHA

    # see https://stackoverflow.com/questions/62753648/rpc-failed-http-400-curl-22-the-requested-url-returned-error-400-bad-request
    - git config --global http.postBuffer 524288000

    # change origin to github
    - git remote add github-origin https://chkp-${GITLAB_USER_NAME}:${GH_TOKEN}@github.com/CheckPointSW/CloudGuardIaaS.git

    # Fetch latest from GitHub master to ensure up-to-date before pushing
    - git fetch github-origin master || true
    - git rebase github-origin/master || {
        echo "Rebase failed. Please resolve conflicts manually.";
        exit 1;
      }

       # push to github PR and merge it (targeting master branch)
    - git push github-origin $CI_PROJECT_PATH_SLUG-$CI_COMMIT_SHA
    - gh pr create --title "$commit_message" --body "$commit_message" --head $CI_PROJECT_PATH_SLUG-$CI_COMMIT_SHA --base master || echo "PR already exists or failed to create."
    - gh pr update-branch --rebase || echo "No update needed or failed to update branch."

    # Use auto-merge to reduce manual intervention (into master)
    - gh pr merge --squash --delete-branch || {
        echo "Auto-merge failed. Please merge manually on GitHub.";
        exit 1;
      }

  only:
    - master
